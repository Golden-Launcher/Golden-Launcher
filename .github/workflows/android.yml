- name: Discord Notification - Success
        if: success()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "content": "🔔 Golden Launcher Build Success!",
              "embeds": [{
                "title": "✅ Build Passed",
                "description": "Commit: ${{ github.event.head_commit.message }}\nAuthor: ${{ github.event.head_commit.author.name }}\nBranch: ${{ github.ref_name }}",
                "color": 16766720,
                "thumbnail": {
                  "url": "https://raw.githubusercontent.com/Golden-Launcher/Golden-Launcher/v3_openjdk/app_pojavlauncher/src/main/assets/amethyst.png"
                }
              }]
            }'

      - name: Discord Notification - Failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "content": "🔔 Golden Launcher Build Failed!",
              "embeds": [{
                "title": "❌ Build Failed",
                "description": "Commit: ${{ github.event.head_commit.message }}\nAuthor: ${{ github.event.head_commit.author.name }}\nBranch: ${{ github.ref_name }}",
                "color": 16711680,
                "thumbnail": {
                  "url": "https://raw.githubusercontent.com/Golden-Launcher/Golden-Launcher/v3_openjdk/app_pojavlauncher/src/main/assets/amethyst.png"
                }
              }]
            }'